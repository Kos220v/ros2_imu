name: host-tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: C firmware tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -DIMU_HOST_TEST \
            -ICore/Inc -Itests/host/hal_stub \
            Core/Src/imu_protocol.c Core/Src/madgwick_ahrs.c \
            Core/Src/imu_fusion.c Core/Src/mpu6050.c Core/Src/qmc5883l.c \
            Core/Src/imu_flash.c Core/Src/imu_app.c Core/Src/debug_log.c \
            tests/host/hal_stub/hal_stub.c tests/host/test_all.c \
            -o /tmp/imu_host_test -lm
          /tmp/imu_host_test
      - name: Python protocol tests
        run: python3 ros2/imu_stm32_bridge/test/test_protocol.py
